<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Martina Mae Trisha N. Hetil - Personal Profile</title>
<style>
* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0 90px;
  font-family: Verdana, Geneva, sans-serif;
  line-height: 1.7;
  color: #800000;
  background: white url(../image/pic4.png) repeat-y left top / 70px auto,
              url(../image/pic4.png) repeat-y right top / 70px auto;
}

.flex-container {
  display: flex;
}

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  flex-direction: row;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin: 0 -90px;
  padding: 16px 90px;
  background: #f2b705;
  box-shadow: 0 3px 8px rgba(128, 0, 0, 0.25);
}

.header h1 {
  margin: 0;
  font-size: 24px;
  letter-spacing: 1px;
}

.menu {
  flex-wrap: wrap;
  gap: 8px;
}

.menu a {
  padding: 7px 18px;
  font-size: 14px;
  text-decoration: none;
  color: #800000;
  background: #fffaf0;
  border-radius: 25px;
  transition: all 0.2s;
}

.menu a:hover {
  background: #800000;
  color: #fffaf0;
}

.page {
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 0 50px;
  background: white;
}

h2 {
  margin: 48px 0 14px;
  font-size: 22px;
}

h2::before {
  content: "★";
  margin-right: 10px;
  color: #f2b705;
}

.about {
  flex-direction: row;
  align-items: center;
  gap: 30px;
}

.about p {
  flex: 1;
  margin: 0;
}

.about img {
  width: 240px;
  max-width: 45%;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(128, 0, 0, 0.25);
}

table {
  width: 100%;
  border-collapse: collapse;
  border-radius: 10px;
  overflow: hidden;
}

th, td {
  padding: 12px 14px;
  text-align: left;
  border-bottom: 1px solid #f3e6b3;
}

th {
  background: #fff1b8;
}

tbody tr:hover {
  background: #fffaf0;
}

ul {
  padding-left: 22px;
}

li {
  margin-bottom: 4px;
}

li::marker {
  color: #f2b705;
}

.cats {
  display: block;
  width: 100%;
  height: auto;
  margin-top: 22px;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(128, 0, 0, 0.25);
}

.goals {
  padding: 16px 22px;
  background: #fffaf0;
  border-left: 5px solid #f2b705;
  border-radius: 0 10px 10px 0;
}

.goals p {
  margin: 0;
}

a {
  color: #800000;
}

.footer {
  flex-direction: row;
  justify-content: center;
  gap: 20px;
  margin-top: 50px;
  padding-top: 20px;
  font-size: 14px;
}

@media (max-width: 600px) {
  body {
    padding: 0 40px;
    background-size: 30px auto, 30px auto;
  }

  .header {
    margin: 0 -40px;
    padding: 14px 40px;
    justify-content: center;
    text-align: center;
  }

  .menu {
    justify-content: center;
  }

  .about {
    flex-direction: column;
  }

  .about img {
    max-width: 75%;
  }
}
</style>
</head>
<body>

<header class="header flex-container" id="top">
  <h1>★ Personal Profile ★</h1>
  <nav class="menu flex-container">
    <a href="#about">About</a>
    <a href="#education">Education</a>
    <a href="#course">Course</a>
    <a href="#hobbies">Hobbies</a>
    <a href="#goals">Goals</a>
  </nav>
</header>
